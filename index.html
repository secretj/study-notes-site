<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https:; connect-src https://api.github.com https://raw.githubusercontent.com http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<title>공부 기록</title>
<link rel="stylesheet" href="style.css?v=7">
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
</head>
<body class="memo">

<!-- 앱 -->
<div id="app" hidden>
  <header class="topbar">
    <div class="inner">
      <button id="btn-menu" class="btn icon only-narrow" aria-label="목록 열기">☰</button>
      <a href="#/" class="brand" aria-label="홈">
        <span class="mono" id="brand-mono">J</span>
        <span class="bt"><b id="brand-name">secretj</b><span id="brand-sub">study notes</span></span>
      </a>
      <nav class="topnav" aria-label="빠른 이동">
        <a href="#/" data-jump="home">홈</a>
        <button data-jump="topic">주제</button>
        <button data-jump="tag">태그</button>
        <button data-jump="year">연도</button>
      </nav>
      <span class="spacer"></span>
      <span id="count-badge" class="badge"></span>
      <span id="status" class="badge"></span>
      <button id="btn-new-page" class="btn">새 글</button>
      <button id="btn-upload" class="btn">올리기</button>
      <button id="btn-logout" class="btn ghost">로그인</button>
    </div>
  </header>

  <div class="shell">
    <aside id="sidebar" class="sidebar">
      <input id="search" class="search" type="search" placeholder="제목·태그로 찾기">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="topic" class="on">주제</button>
        <button role="tab" data-tab="tag">태그</button>
        <button role="tab" data-tab="year">연도</button>
      </div>
      <nav id="nav" class="nav" aria-label="글 목록"></nav>
      <div class="side-foot">
        <button id="btn-new-topic" class="btn small">새 주제</button>
        <label class="check"><input id="show-hidden" type="checkbox"> 숨긴 파일 보기</label>
      </div>
    </aside>

    <main id="main" class="main">
      <div id="screen"></div>

      <section id="editor" class="editor" hidden>
        <div class="editor-head">
          <div class="eyebrow" id="editor-path"></div>
          <div class="fields">
            <label class="grow">제목<input id="e-title"></label>
            <label>날짜<input id="e-date" type="date"></label>
            <label class="grow">태그 <span class="hint">쉼표로 구분</span><input id="e-tags" list="tag-list"></label>
          </div>
          <div class="editor-bar">
            <button id="btn-insert-image" class="btn small">이미지 넣기</button>
            <span class="hint">이미지를 본문에 끌어다 놓아도 돼요</span>
            <span class="spacer"></span>
            <button id="btn-cancel" class="btn ghost">취소</button>
            <button id="btn-save" class="btn primary">저장</button>
          </div>
        </div>
        <div class="editor-panes">
          <textarea id="source" spellcheck="false" aria-label="본문"></textarea>
          <article id="preview" class="prose"></article>
        </div>
      </section>
    </main>
  </div>
  <div id="drop" class="drop" hidden><div>여기에 놓으면 <b id="drop-target"></b> 에 올려요</div></div>
</div>

<dialog id="modal">
  <form method="dialog" id="modal-form">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button value="cancel" class="btn ghost" formnovalidate>취소</button>
      <button value="ok" id="modal-ok" class="btn primary">확인</button>
    </div>
  </form>
</dialog>

<datalist id="tag-list"></datalist>
<datalist id="group-list"></datalist>
<input id="file-input" type="file" multiple hidden>
<input id="image-input" type="file" accept="image/*" multiple hidden>
<div id="toast" class="toast" role="status" hidden></div>

<script src="app.js?v=7"></script>
</body>
</html>
